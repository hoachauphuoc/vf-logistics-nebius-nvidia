name: CI

# `master`, not `main`.
#
# This workflow has existed since a452fd6 and had NEVER RUN ONCE. It was registered and
# reported `active`, but both triggers filtered on `main` while this repository's default
# branch is `master` and no `main` branch has ever existed -- so the condition could not
# match and GitHub had nothing to report. `gh run list` returned zero runs across the whole
# history of the repo.
#
# That made the README and SUBMISSION claim of a CI pipeline aspirational rather than
# false-by-a-hair: the jobs below are correct for this layout, they simply were not being
# invoked. Both branch names are listed now so a future rename to `main` does not silently
# switch it off again.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # E501 is line length, left to judgement rather than enforced.
      #
      # E402 (module import not at top) is deliberate here and the code says why:
      # app.py:27 explains that vf_logistics.auth is imported AFTER dotenv so
      # IAP_ENABLED, VF_API_KEY and ANONYMOUS_ROLE are read from a loaded .env rather
      # than a bare shell. tests/test_pure_logic.py places each import beside the test
      # that uses it. Enforcing E402 would mean reordering for the linter's benefit and
      # breaking the load order the comment warns about.
      #
      # W291/W293 (trailing / blank-line whitespace) fire 81 times, and 47 of those are
      # INSIDE triple-quoted f-strings that are model prompts -- debate_agent 26,
      # verifier 12, investigation_agent 9. Whitespace in a prompt is model input, not
      # code formatting, so "fixing" it edits what the model is asked. Not worth it for
      # a style rule.
      #
      # F stays fully on, which is the part that catches real defects: undefined names
      # and unused imports. Twenty unused imports were removed when this job first ran.
      - run: ruff check src/ tests/ --select E,F,W --ignore E501,E402,W291,W293

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock mypy
      - run: mypy src/vf_logistics/ --ignore-missing-imports --no-error-summary || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements.lock is RUNTIME only -- it has no pytest, so the first real run of
      # this job died with "No module named pytest". The test tooling is declared in
      # pyproject.toml's [project.optional-dependencies] dev extra; install that rather
      # than repeating a version list that would drift from it.
      - run: pip install -r requirements.lock
      - run: pip install "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "pytest-mock>=3.12.0"
      - run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: pip install "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "pytest-mock>=3.12.0" "pytest-cov>=4.1.0"
      - run: python -m pytest tests/ --cov=vf_logistics --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
