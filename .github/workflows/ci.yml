name: CI

# `master`, not `main`.
#
# This workflow has existed since a452fd6 and had NEVER RUN ONCE. It was registered and
# reported `active`, but both triggers filtered on `main` while this repository's default
# branch is `master` and no `main` branch has ever existed -- so the condition could not
# match and GitHub had nothing to report. `gh run list` returned zero runs across the whole
# history of the repo.
#
# That made the README and SUBMISSION claim of a CI pipeline aspirational rather than
# false-by-a-hair: the jobs below are correct for this layout, they simply were not being
# invoked. Both branch names are listed now so a future rename to `main` does not silently
# switch it off again.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/ --select E,F,W --ignore E501

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock mypy
      - run: mypy src/vf_logistics/ --ignore-missing-imports --no-error-summary || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: python -m pytest tests/ --cov=vf_logistics --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
