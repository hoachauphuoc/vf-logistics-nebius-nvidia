name: Demo health

# Keeps the judged deployment reachable through the judging window, at no cost.
#
# The hackathon requires the demo to stay live until judging closes, and a cold start
# (Cloud Run scales to zero, so the first visit after an idle hour waits 10-20 s) can break
# it without anyone noticing. This job reads only /health. It never writes, never signs in,
# and holds no secret, so a failure here is a signal for a person rather than an automated
# repair that could fight a judge.
#
# The deployed console and API answer 401 to an anonymous visitor (ANONYMOUS_ROLE=none), so
# the agent state and the board are not checked here: an unauthenticated check of them failed
# on every run from 2026-10-20.
#
# Pinging every 20 minutes during European and American working hours keeps an
# instance warm: Cloud Run bills request time, not idle time, and a GET to /health
# costs nothing measurable. It switches itself off after the judging window.
on:
  schedule:
    - cron: "*/20 6-23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://vf-app-350828852747.asia-southeast1.run.app
      LAST_DAY: "2026-12-16"
    steps:
      - name: Stop after the judging window
        id: window
        run: |
          if [[ "$(date -u +%F)" > "$LAST_DAY" ]]; then
            echo "Judging closed on $LAST_DAY; nothing to watch."
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Service answers
        if: steps.window.outputs.open == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BASE/health")
          echo "/health -> $code"
          test "$code" = "200"
