[project]
name = "vf-logistics-fraud-detection"
version = "1.0.0"
description = "AI-powered shipping fraud detection with human-in-the-loop governance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "VF Logistics contributors"}
]
keywords = [
    "fraud-detection",
    "logistics",
    "ai-agents",
    "nebius",
    "nvidia-nemotron",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # AI model layer - Nebius Token Factory (OpenAI-compatible)
    "openai>=1.40.0,<2.0.0",

    # Google Cloud Services (infrastructure only)
    "google-cloud-firestore>=2.11.0,<3.0.0",
    "google-cloud-pubsub>=2.18.0,<3.0.0",
    "google-cloud-storage>=2.10.0,<3.0.0",

    # Web Framework
    "flask>=2.3.0,<4.0.0",
    "gunicorn>=21.2.0,<23.0.0",
    "flask-cors>=4.0.0,<5.0.0",

    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "pypdf>=4.0.0,<5.0.0",
    "httpx>=0.24.0,<1.0.0",

    # PDF rasterisation (Apache 2.0 / BSD-3 licensed)
    "pypdfium2>=4.30.0,<6.0.0",

    # Bill of lading generation
    "fpdf2>=2.7.0,<3.0.0",

    # Request/response validation (Phase 2)
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (allowed in tests)
    "B008",   # function call in default argument (common in FastAPI/Flask)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # Allow asserts and hardcoded credentials in tests

[tool.ruff.isort]
known-first-party = ["agents", "nebius_client", "tavily_client", "store", "governance", "verifier", "orchestrator"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "flask_cors",
    "pypdfium2",
    "fpdf.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/vf_logistics"]
omit = [
    "tests/*",
    "scripts/*",
    "*.pyc",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Scripts for development workflow
[project.scripts]
# These would be used if packaged as a library
# vf-fraud = "main:app"

# Entry points for pip install -e . workflow
# Run with: python -m vf_logistics.main
