# Cloud Build CI/CD Pipeline
#
# This configuration:
# 1. Runs linting and tests before any deployment
# 2. Builds and pushes Docker image to Artifact Registry
# 3. Deploys to staging first, then production (manual approval)
#
# Required Substitutions:
#   _SERVICE_NAME: Cloud Run service name
#   _REGION: GCP region (e.g., asia-southeast1)
#   _ARTIFACT_REGISTRY: Artifact Registry path

substitutions:
  _SERVICE_NAME: vf-logistics-fraud-detection
  _REGION: asia-southeast1
  _ARTIFACT_REGISTRY: asia-southeast1-docker.pkg.dev/${PROJECT_ID}/vf-logistics

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ============== PHASE 1: QUALITY GATES ==============

  # Step 1: Install dependencies and run linting
  - name: 'python:3.11-slim'
    id: 'lint'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install --quiet ruff
        echo "Running ruff linter..."
        ruff check . --output-format=github
        ruff format --check .

  # Step 2: Run unit tests (must pass before build)
  - name: 'python:3.11-slim'
    id: 'test'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install --quiet -r requirements.txt pytest pytest-asyncio
        echo "Running test suite..."
        python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
    waitFor: ['lint']

  # ============== PHASE 2: BUILD ==============

  # Step 3: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'
      - '--cache-from'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'
      - '.'
    waitFor: ['test']

  # Step 4: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}'
    waitFor: ['build']

  # ============== PHASE 3: STAGING DEPLOYMENT ==============

  # Step 5: Deploy to staging
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-staging'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}-staging'
      - '--image'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'ENVIRONMENT=staging,LOG_LEVEL=DEBUG'
      - '--no-allow-unauthenticated'
    waitFor: ['push']

  # Step 6: Run smoke tests against staging
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test-staging'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Waiting for staging deployment to stabilize..."
        sleep 30
        
        # Get staging service URL
        STAGING_URL=$(gcloud run services describe ${_SERVICE_NAME}-staging \
          --region ${_REGION} --format 'value(status.url)')
        
        echo "Running smoke tests against: $STAGING_URL"
        
        # Health check
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
          "$STAGING_URL/health")
        
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "Health check failed with status: $HTTP_STATUS"
          exit 1
        fi
        
        echo "Smoke tests passed!"
    waitFor: ['deploy-staging']

  # ============== PHASE 4: PRODUCTION DEPLOYMENT ==============
  # Note: In a real setup, you would add a manual approval gate here

  # Step 7: Deploy to production
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-production'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '4'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '100'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LOG_LEVEL=INFO'
      - '--no-allow-unauthenticated'
    waitFor: ['smoke-test-staging']

# Artifacts to save
artifacts:
  objects:
    location: 'gs://${PROJECT_ID}-build-artifacts/${BUILD_ID}'
    paths:
      - 'test-results.xml'

# Build timeout
timeout: '1800s'

# Images to push to Artifact Registry
images:
  - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'
